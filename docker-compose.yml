services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python ML microservice (BART summarize + MiniLM embed) ───────────────────
  ml-service:
    build:
      context: ./ml-service
      args:
        PREBAKE_BART: "true"
    ports:
      - "8000:8000"
    volumes:
      # Cache the HF model weights outside the container so they survive rebuilds.
      # First run will download ~1.6GB; every run after is instant.
      - hf-cache:/app/.hf-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Express/Node backend ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/notepadpro
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # ── React frontend (Vite dev server for local, static build for prod) ─────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  hf-cache:
